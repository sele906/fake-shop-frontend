<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/logo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 헤더 배경(--bg)과 같은 값. 어긋나면 화면 위쪽에 검은 띠가 생긴다. -->
    <meta name="theme-color" content="#f4f5f7" />
    <meta
      name="description"
      content="장바구니는 채워도 결제는 못 하는 가짜 쇼핑몰, 안삼."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.ico" />
    <!--
      본문 폰트. 예전에는 index.css가 fonts.googleapis.com을 @import 했는데,
      그러면 앱을 켤 때마다 인터넷을 타고 그동안 글자가 안 그려졌다.
      조각 파일은 public/fonts/noto-sans-kr/에 들어 있다.
    -->
    <link rel="stylesheet" href="%PUBLIC_URL%/fonts/noto-sans-kr.css" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>안삼 - 사고 싶지만 살 수는 없는 쇼핑몰</title>
    <!--
      다크모드는 <html data-theme="dark"> 하나로 갈린다 (index.css).
      CSS 미디어쿼리를 쓰지 않아서 OS 설정은 여기서 읽는다 — 이유는 index.css
      다크모드 주석 참고.

      저장값은 "light" · "dark" · "system" 셋이다. 그 둘이 아니면(= "system"이거나
      아직 고른 적이 없으면) OS를 따른다. 고른 적 없는 상태와 "system"을 같게
      다루는 것이 의도다 — 처음 여는 사람과 시스템으로 되돌린 사람이 같은 화면을
      본다.

      번들보다 먼저, 동기로 돌아야 한다. 늦으면 밝은 화면이 한 번 번쩍인다.
    -->
    <script>
      try {
        var t = localStorage.getItem("ansamTheme");
        var followSystem = t !== "dark" && t !== "light";
        if (t === "dark" || (followSystem && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
